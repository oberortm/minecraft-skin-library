<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skin Library</title>
<meta name="app-version" content="50">
<meta name="description" content="Personal Minecraft skin library in your browser: collect skins, view them in 3D and draw your own. Everything stays local.">
<link rel="icon" href="icon.svg?v=50" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css?v=50">
<link rel="stylesheet" href="css/looks.css?v=50">
<link rel="stylesheet" href="css/present.css?v=50">
<script>
  // apply the saved theme before first paint; Studio is the only look
  (function () {
    var d = document.documentElement;
    d.dataset.look = "studio";
    try { var th = localStorage.getItem("skin-library-theme"); if (th === "light" || th === "dark") d.dataset.theme = th; } catch (e) {}
  })();
</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M4 15v4h16v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M10 3h4l.6 2.6 2.2 1.3 2.6-.8 2 3.4-2 1.9v2.6l2 1.9-2 3.4-2.6-.8-2.2 1.3L14 21h-4l-.6-2.6-2.2-1.3-2.6.8-2-3.4 2-1.9v-2.6l-2-1.9 2-3.4 2.6.8 2.2-1.3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 8.5v5l4.5-2.5z" fill="currentColor"/><path d="M8 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-full-exit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-group" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6.5 20a5.5 5.5 0 0111 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="5" cy="10" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="19" cy="10" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M1.5 18a3.5 3.5 0 015-3M22.5 18a3.5 3.5 0 00-5-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0112 5c5 0 9 4.5 10 7-.4 1-1.3 2.4-2.6 3.7M6.5 6.6C4.4 8 2.9 10 2 12c1 2.5 5 7 10 7 1.7 0 3.3-.5 4.6-1.3M9.9 9.9a3 3 0 004.2 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-armor" viewBox="0 0 24 24"><path d="M8 3l-4 2v6h3v10h10V11h3V5l-4-2c0 2-1.8 3.5-4 3.5S8 5 8 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="currentColor"/></symbol>
  <symbol id="i-star-o" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M9 20h11M4.5 15.5l9-9 6 6-7.5 7.5H8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-fill" viewBox="0 0 24 24"><path d="M5 11l7-7 7 7-7 7zM5 11h14M20 15s1.5 2 1.5 3a1.5 1.5 0 01-3 0c0-1 1.5-3 1.5-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-noise" viewBox="0 0 24 24"><path d="M4 20l1-4L13 8l3 3-8 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15 3h2v2h-2zM19 5h2v2h-2zM17 8h2v2h-2zM20 10h2v2h-2zM18 1h2v2h-2z" fill="currentColor"/></symbol>
  <symbol id="i-gradient" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 8h2v8H7zM11 8h2v8h-2z" fill="currentColor" opacity=".9"/><path d="M15 8h1.5v8H15z" fill="currentColor" opacity=".5"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4v14m0 0l-3-3m3 3l3-3M17 20V6m0 0l-3 3m3-3l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-picker" viewBox="0 0 24 24"><path d="M14 6l4 4M5 19l1-4 8.5-8.5a2.1 2.1 0 013 3L9 18z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="app">
  <header class="top">
    <button class="hdr-close" id="hdrClose" type="button" data-i18n-title="hideHeader"><svg class="ic"><use href="#i-x"/></svg></button>
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path class="mk-top" d="M16 2 29 9.5 16 17 3 9.5z"/>
        <path class="mk-left" d="M3 9.5 16 17v14L3 23.5z"/>
        <path class="mk-right" d="M29 9.5 16 17v14l13-7.5z"/>
      </svg>
      <div class="brand-text">
        <h1>Skin Library</h1>
        <p class="tagline"><span data-i18n="tagline"></span> <a class="oss" href="https://github.com/oberortm/minecraft-skin-library" target="_blank" rel="noopener">[<span data-i18n="openSource"></span>]</a></p>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn primary" id="importBtn"><svg class="ic"><use href="#i-upload"/></svg><span data-i18n="import"></span></button>
      <button class="btn" id="newBtn"><svg class="ic"><use href="#i-plus"/></svg><span data-i18n="newSkin"></span></button>
      <button class="btn" id="presentBtn" aria-pressed="false"><svg class="ic"><use href="#i-play"/></svg><span data-i18n="present"></span></button>
      <button class="btn icon-only" id="themeBtn" data-i18n-title="toggleTheme"><svg class="ic"><use href="#i-moon"/></svg></button>
      <button class="btn lang" id="langBtn" data-i18n-title="toggleLang">EN</button>
      <details class="menu" id="moreMenu">
        <summary class="btn icon-only" data-i18n-title="more"><svg class="ic"><use href="#i-more"/></svg></summary>
        <div class="menu-pop">
          <button class="menu-item" id="backupExportBtn" data-i18n="backupExport"></button>
          <button class="menu-item" id="backupImportBtn" data-i18n="backupImport"></button>
          <p class="menu-note" data-i18n="storageText"></p>
        </div>
      </details>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <label class="search"><span class="sr" data-i18n="search"></span><input type="search" id="searchInput" data-i18n-ph="searchPh" autocomplete="off"></label>
    <div class="tool-group"><span class="seg-label" data-i18n="view"></span>
      <span class="seg" id="viewSeg"><button data-v="front" id="view-front" data-i18n="front"></button><button data-v="back" id="view-back" data-i18n="back"></button><button data-v="tex" id="view-tex" data-i18n="texture"></button></span></div>
    <div class="tool-group"><span class="seg-label" data-i18n="arms"></span>
      <span class="seg" id="filterSeg"><button data-v="all" id="filter-all" data-i18n="all"></button><button data-v="slim" id="filter-slim" data-i18n="slim"></button><button data-v="classic" id="filter-classic" data-i18n="classic"></button><button data-v="fav" id="filter-fav" data-i18n-title="favorites"><svg class="ic sm"><use href="#i-star"/></svg></button></span></div>
    <label class="tool-group"><span class="seg-label" data-i18n="sort"></span>
      <select id="sortSelect"><option value="new" data-i18n="sortNew"></option><option value="old" data-i18n="sortOld"></option><option value="name" data-i18n="sortName"></option></select></label>
    <span class="count" id="countLabel" aria-live="polite"></span>
  </div>

  <main>
    <section class="empty" id="emptyState" hidden>
      <div class="drop-art" aria-hidden="true"><canvas id="emptyFigure" width="16" height="32"></canvas></div>
      <h2 data-i18n="emptyTitle"></h2>
      <p data-i18n="emptyText"></p>
      <div class="row center">
        <button class="btn primary" id="emptyImportBtn"><svg class="ic"><use href="#i-upload"/></svg><span data-i18n="chooseFiles"></span></button>
        <button class="btn" id="emptyNewBtn"><svg class="ic"><use href="#i-pencil"/></svg><span data-i18n="drawFirst"></span></button>
      </div>
      <form class="row center empty-player" id="emptyPlayerForm">
        <label class="sr" for="emptyPlayer" data-i18n="playerLabel"></label>
        <input id="emptyPlayer" data-i18n-ph="playerPh" autocomplete="off" maxlength="16" spellcheck="false">
        <button class="btn" type="submit" data-i18n="playerGet"></button>
      </form>
    </section>
    <section class="player-hit" id="playerHit" hidden aria-live="polite">
      <canvas id="phFig" width="16" height="32" aria-hidden="true"></canvas>
      <div class="ph-text"><span class="ph-label" data-i18n="playerLabel"></span><b id="phName"></b><span id="phStatus"></span></div>
      <button class="btn primary" id="phAdd" hidden><svg class="ic"><use href="#i-plus"/></svg><span data-i18n="playerAdd"></span></button>
    </section>
    <p class="no-match" id="noMatch" hidden data-i18n="noMatch"></p>
    <div class="grid" id="grid"></div>
  </main>

  <footer class="foot">
    <span data-i18n="footer"></span>
    <a href="https://github.com/oberortm/minecraft-skin-library" target="_blank" rel="noopener" data-i18n="sourceCode"></a>
  </footer>
</div>

<!-- Presentation -->
<section id="present" class="present" data-scene="studio" hidden aria-label="Presentation">
  <div class="pr-bg" aria-hidden="true"><i class="pr-sun"></i><i class="pr-moon"></i><i class="pr-beam"></i></div>
  <canvas class="pr-fx" id="prFx" aria-hidden="true"></canvas>
  <div class="pr-big" id="prBig" aria-hidden="true"></div>
  <div class="pr-floor" aria-hidden="true"></div>
  <div class="pr-stage" id="prStage"><div class="fallback" id="prFallback" hidden>3D unavailable</div></div>
  <div class="pr-flash" aria-hidden="true"></div>
  <canvas class="pr-cine" id="prCine" aria-hidden="true"></canvas>
  <button class="pr-icon pr-menu" id="prMenu" data-i18n-title="showHeader"><svg class="ic"><use href="#i-menu"/></svg></button>
  <div class="pr-corner">
    <button class="pr-icon" id="prEquip" aria-expanded="false" aria-controls="prEquipPanel" data-i18n-title="equipment"><svg class="ic"><use href="#i-armor"/></svg></button>
    <button class="pr-icon" id="prPhoto" aria-expanded="false" aria-controls="prPhotoPanel" data-i18n-title="photo"><svg class="ic"><use href="#i-camera"/></svg></button>
    <button class="pr-icon" id="prGroupBtn" aria-expanded="false" aria-controls="prGroupPanel" data-i18n-title="groupPhoto"><svg class="ic"><use href="#i-group"/></svg></button>
    <button class="pr-icon" id="prHideUi" data-i18n-title="hideUi"><svg class="ic"><use href="#i-eye-off"/></svg></button>
    <button class="pr-icon pr-world-btn" id="prWorld" aria-expanded="false" aria-controls="prWorldPanel" data-i18n-title="settings"><svg class="ic"><use href="#i-gear"/></svg></button>
    <button class="pr-icon" id="prFull" data-i18n-title="fullscreen"><svg class="ic"><use href="#i-full"/></svg></button>
    <button class="pr-icon" id="prClose" data-i18n-title="presentExit"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <div class="pr-panel pr-equip" id="prEquipPanel" hidden>
    <h3 data-i18n="equipment"></h3>
    <label class="pr-check"><input type="checkbox" id="eqElytra"> <span data-i18n="elytra"></span></label>
    <p class="pr-panel-hint" data-i18n="elytraHint"></p>
    <div id="eqArmor"></div>
    <div id="eqItems"></div>
  </div>
  <div class="pr-panel" id="prPhotoPanel" hidden>
    <h3 data-i18n="photo"></h3>
    <div class="pr-panel-row"><span class="pr-panel-label" data-i18n="photoBg"></span>
      <span class="pr-seg" id="prPhotoBg"><button type="button" data-v="scene" data-i18n="photoBgScene"></button><button type="button" data-v="clear" data-i18n="photoBgClear"></button></span></div>
    <div class="pr-panel-row"><span class="pr-panel-label" data-i18n="photoSize"></span>
      <span class="pr-seg" id="prPhotoSize"><button type="button" data-v="1">1×</button><button type="button" data-v="2">2×</button><button type="button" data-v="4">4×</button></span></div>
    <p class="pr-panel-hint" id="prPhotoHint" data-i18n="photoHint"></p>
    <button class="pr-pill" id="prPhotoSave" type="button"><svg class="ic sm"><use href="#i-camera"/></svg><span data-i18n="photoSave"></span></button>
  </div>
  <div class="pr-panel" id="prGroupPanel" hidden>
    <h3 data-i18n="groupPhoto"></h3>
    <label class="pr-check"><input type="checkbox" id="grpOn"> <span data-i18n="groupOn"></span></label>
    <p class="pr-panel-hint" data-i18n="groupHint"></p>
    <div class="grp-list" id="grpList"></div>
  </div>
  <div class="pr-panel pr-emotes" id="prEmotes" hidden></div>
  <div class="pr-panel pr-emotes pr-cine-panel" id="prCinePanel" hidden>
    <button class="pr-cine-opt" type="button" id="cineBuild"><b data-i18n="cineBuild"></b><span data-i18n="cineBuildHint"></span></button>
    <button class="pr-cine-opt" type="button" id="cineTrailer"><b data-i18n="cineTrailer"></b><span data-i18n="cineTrailerHint"></span></button>
    <label class="pr-check"><input type="checkbox" id="cineRecord"> <span data-i18n="cineRecord"></span></label>
    <p class="pr-panel-hint" id="cineNoVideo" hidden data-i18n="cineNoVideo"></p>
  </div>
  <div class="pr-tex-badge" id="prTexBadge" role="status" hidden><span data-i18n="texLoading"></span> <b id="prTexBadgePct"></b></div>
  <div class="pr-panel" id="prWorldPanel" hidden>
    <h3 data-i18n="worldSettings"></h3>
    <div class="pr-panel-row pr-quality-row">
      <span class="pr-panel-label" data-i18n="quality"></span>
      <span class="pr-seg" id="prQuality" role="group"><button type="button" data-q="high" id="quality-high" data-i18n="qualityHigh"></button><button type="button" data-q="low" id="quality-low" data-i18n="qualityLow"></button></span>
    </div>
    <p class="pr-panel-hint pr-quality-row" data-i18n="qualityHint"></p>
    <label class="pr-panel-row pr-quality-row">
      <span class="pr-panel-label" data-i18n="weather"></span>
      <select class="pr-select" id="prWeather">
        <option value="clear" data-i18n="weather_clear"></option><option value="rain" data-i18n="weather_rain"></option>
        <option value="snow" data-i18n="weather_snow"></option><option value="fireflies" data-i18n="weather_fireflies"></option>
        <option value="leaves" data-i18n="weather_leaves"></option>
      </select>
    </label>
    <p class="pr-panel-hint pr-quality-row" data-i18n="weatherHint"></p>
    <label class="pr-panel-row">
      <span class="pr-panel-label" data-i18n="resourcePack"></span>
      <select class="pr-select" id="prTexSource">
        <option value="vanilla" data-i18n="texVanilla"></option>
        <option value="faithful">Faithful 32x</option>
        <option value="barebones">Bare Bones</option>
        <option value="ashen">Ashen 16x</option>
        <option value="builtin" data-i18n="texBuiltin"></option>
        <option value="file" data-i18n="texFile"></option>
      </select>
    </label>
    <button class="pr-pill" id="prPackReload" type="button" data-i18n="texReload" hidden></button>
    <div class="pr-progress" id="prPackProgress" hidden><progress id="prPackBar" max="1"></progress><span id="prPackPct"></span></div>
    <div class="pr-panel-row" id="prPackFileRow" hidden>
      <span class="pr-pack-name" id="prPackName"></span>
      <button class="pr-pill" id="prPackPick" type="button" data-i18n="packChoose"></button>
    </div>
    <p class="pr-panel-hint" id="prPackHint"></p>
    <input type="file" id="prPackInput" accept=".zip,application/zip" hidden>
  </div>
  <button class="pr-nav prev" id="prPrev" data-i18n-title="prev"><svg class="ic"><use href="#i-left"/></svg></button>
  <button class="pr-nav next" id="prNext" data-i18n-title="next"><svg class="ic"><use href="#i-right"/></svg></button>
  <div class="pr-info">
    <div class="pr-count" id="prCount"></div>
    <h2 class="pr-name" id="prName"></h2>
    <div class="pr-meta" id="prMeta"></div>
  </div>
  <div class="pr-controls">
    <div class="pr-seg" id="prGroups" role="group"></div>
    <div class="pr-row" id="prScenes" role="group"></div>
    <div class="pr-row">
      <div class="pr-row" id="prAnims" role="group"></div>
      <button class="pr-pill" id="prCineBtn" aria-expanded="false" aria-controls="prCinePanel"><svg class="ic sm"><use href="#i-play"/></svg><span data-i18n="cinema"></span></button>
      <button class="pr-pill" id="prRotate" aria-pressed="true"><svg class="ic sm"><use href="#i-rotate"/></svg><span data-i18n="rotate"></span></button>
    </div>
  </div>
</section>

<div class="drop-overlay" id="dropOverlay" hidden><div><svg class="ic xl"><use href="#i-upload"/></svg><p data-i18n="dropHere"></p></div></div>
<input type="file" id="fileInput" accept="image/png" multiple hidden>
<input type="file" id="backupInput" accept=".json,application/json" hidden>
<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- Detail -->
<dialog id="detail" class="sheet" aria-labelledby="dName">
  <div class="sheet-inner">
    <div class="sheet-top">
      <label class="name-field"><span class="sr" data-i18n="nameLabel"></span><input id="dName" maxlength="60" autocomplete="off"></label>
      <button class="btn icon-only fav" id="dFav" data-i18n-title="fav"><svg class="ic"><use href="#i-star-o"/></svg></button>
      <span class="badge" id="dModel"></span>
      <span class="badge" id="dFmt" hidden></span>
      <span class="spacer"></span>

<script>
  // last line of defence: if the app could not start (e.g. a file failed to load), say so instead of a dead page
  window.addEventListener("load", function () {
    setTimeout(function () {
      if (window.__skinLibraryBooted) return;
      var de = document.documentElement.lang === "de";
      var el = document.createElement("div");
      el.className = "boot-fail";
      el.setAttribute("role", "alert");
      el.innerHTML = de
        ? "Die Seite konnte nicht vollständig laden. <button type=\"button\">Neu laden</button>"
        : "The page could not load completely. <button type=\"button\">Reload</button>";
      el.querySelector("button").onclick = function () { location.reload(); };
      document.body.appendChild(el);
    }, 4000);
  });
</script>
